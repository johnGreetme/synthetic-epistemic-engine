[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-epistemic-engine"
version = "1.0.0"
description = "Synthetic Epistemic Engine (SEE): Biologically-inspired decentralized robotic swarm intelligence with Active Inference, Z3 Crucible Verification, and Zero-Trust Gossipsub"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kytin Swarm Architecture Team" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpyro>=0.13.0",
    "z3-solver>=4.12.0",
    "pyzmq>=25.0.0",
    "faiss-cpu>=1.7.4",
    "cryptography>=41.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["see*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
